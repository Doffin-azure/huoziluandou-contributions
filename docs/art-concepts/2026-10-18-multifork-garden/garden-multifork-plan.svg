<text x="210" y="1170" font-size="11.5" fill="#5f655f">F3 碑堂：听雨书屋 / 息灯水榭（火堆）  vs  问字轩 / 藏字水榭（含 F4） → 后殿前庭</text>
<text x="210" y="1188" font-size="11.5" fill="#5f655f">F4 藏字水榭：南廊（战斗） / 夹院（宝藏） → 后殿前庭</text>
<text x="210" y="1206" font-size="11.5" fill="#5f655f">F5 后殿前庭：听石轩（精英） / 南岸（事件） → 后殿</text>
<text x="140" y="1220" font-size="11.5" fill="#7b8178">当前计划：01→02→03→04→05→07→08→11→12→13→18→19→21。改选规则：完成支路第一间房前可退回改选；完成后封另一支。已领取奖励不回滚。</text>
