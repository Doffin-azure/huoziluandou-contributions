<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420">
  <rect width="860" height="420" fill="#f4ecd8"/>
  <text x="34" y="46" font-family="Noto Serif SC, SimSun, serif" font-size="26" font-weight="bold" fill="#221f1a">定义：污染（附着在字上，不改变字形）</text>
  <text x="34" y="76" font-family="Noto Serif SC, SimSun, serif" font-size="16" fill="#7c7360">污染【击】仍然可以正常连成【反击】【击破】；只是打出时要付出代价。</text>

  <!-- 带污染的字 -->
  <g transform="translate(60,110)">
    <rect width="130" height="130" rx="14" fill="#b98a8a" stroke="#6f4a24" stroke-width="3"/>
    <text x="65" y="92" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="70" fill="#2b1c0c">击</text>
    <rect x="86" y="6" width="38" height="34" rx="8" fill="#8c2a20"/>
    <text x="105" y="32" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="24" fill="#f4ecd8">刺</text>
  </g>
  <text x="125" y="266" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="16" fill="#4a4438">所有者 = 敌方</text>
  <text x="125" y="290" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="16" fill="#4a4438">打出后直接消失</text>

  <!-- 污染类型表 -->
  <g font-family="Noto Serif SC, SimSun, serif">
    <rect x="300" y="104" width="530" height="86" rx="10" fill="#f0e2d6" stroke="#8c2a20" stroke-width="2"/>
    <rect x="316" y="122" width="34" height="34" rx="8" fill="#8c2a20"/>
    <text x="333" y="148" text-anchor="middle" font-size="22" fill="#f4ecd8">刺</text>
    <text x="366" y="136" font-size="19" font-weight="bold" fill="#221f1a">刺痛</text>
    <text x="366" y="164" font-size="16" fill="#4a4438">打出这枚字时，失去 2 点生命。</text>

    <rect x="300" y="200" width="530" height="86" rx="10" fill="#e6e0d0" stroke="#6b6354" stroke-width="2"/>
    <rect x="316" y="218" width="34" height="34" rx="8" fill="#6b6354"/>
    <text x="333" y="244" text-anchor="middle" font-size="22" fill="#f4ecd8">堵</text>
    <text x="366" y="232" font-size="19" font-weight="bold" fill="#221f1a">堵塞</text>
    <text x="366" y="260" font-size="16" fill="#4a4438">打出后，下一次正常补字 -1（一次性）。</text>

    <rect x="300" y="296" width="530" height="86" rx="10" fill="#f0dcc8" stroke="#b0522e" stroke-width="2"/>
    <rect x="316" y="314" width="34" height="34" rx="8" fill="#b0522e"/>
    <text x="333" y="340" text-anchor="middle" font-size="22" fill="#f4ecd8">灼</text>
    <text x="366" y="328" font-size="19" font-weight="bold" fill="#221f1a">灼热</text>
    <text x="366" y="356" font-size="16" fill="#4a4438">过热生成的【热】自带；打出时失去 1 点生命，本场循环。</text>
  </g>

  <g font-family="Noto Serif SC, SimSun, serif" font-size="15" fill="#7c7360">
    <text x="60" y="330">净化：【清洗】清全盘 / 【清】清相邻 / 【清流】【清热】专清灼热</text>
    <text x="60" y="356">移除所有权：净化只去污染，不改字形与归属；【收购】才改归属</text>
    <text x="60" y="382">【防火】：本场打出的灼热【热】不再扣血（但仍占字袋、不被净化）</text>
  </g>
</svg>
