<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440">
  <rect width="1080" height="440" fill="#f4ecd8"/>
  <text x="34" y="44" font-family="Noto Serif SC, SimSun, serif" font-size="26" font-weight="bold" fill="#221f1a">定义：融合 与 叠层</text>

  <!-- 融合 -->
  <text x="34" y="86" font-family="Noto Serif SC, SimSun, serif" font-size="20" font-weight="bold" fill="#5b3f7a">融合（化合）</text>
  <g font-family="Noto Serif SC, SimSun, serif" text-anchor="middle">
    <g transform="translate(40,104)">
      <rect width="90" height="90" rx="12" fill="#a9773f" stroke="#6f4a24" stroke-width="3"/>
      <text x="45" y="66" font-size="50" fill="#2b1c0c">击</text>
    </g>
    <g transform="translate(140,104)">
      <rect width="90" height="90" rx="12" fill="#a9773f" stroke="#6f4a24" stroke-width="3"/>
      <text x="45" y="66" font-size="50" fill="#2b1c0c">破</text>
    </g>
  </g>
  <text x="252" y="160" font-family="Noto Serif SC, SimSun, serif" font-size="34" fill="#b83a2e">⇢</text>
  <g transform="translate(290,104)">
    <rect width="90" height="90" rx="12" fill="#b7a7d9" stroke="#5b3f7a" stroke-width="3"/>
    <text x="45" y="60" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="30" fill="#241a38">击破</text>
  </g>
  <g font-family="Noto Serif SC, SimSun, serif" font-size="16" fill="#4a4438">
    <text x="404" y="132">占 1 格；连词时一次贡献「击」「破」两个字形；</text>
    <text x="404" y="160">单独打出视为两字词【击破】；可由上级再融合成 3 字。</text>
    <text x="404" y="188" fill="#7c7360">洗入字袋/弃字堆时是同一个单位，永不拆散。</text>
  </g>

  <!-- 叠层 -->
  <text x="34" y="262" font-family="Noto Serif SC, SimSun, serif" font-size="20" font-weight="bold" fill="#3c4a6b">叠层（重合 / 精炼）</text>
  <g transform="translate(40,280)">
    <rect width="90" height="90" rx="12" fill="#a9773f" stroke="#3c4a6b" stroke-width="4"/>
    <text x="45" y="66" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="50" fill="#2b1c0c">击</text>
    <text x="74" y="84" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="22" font-weight="bold" fill="#c9a35a">×3</text>
  </g>
  <g font-family="Noto Serif SC, SimSun, serif" font-size="16" fill="#4a4438">
    <text x="160" y="314">1 个真实实体 + N 个临时使用层，本场可重复使用同一格。</text>
    <text x="160" y="342">用掉一层不解体；最后一次才真正消耗实体（入弃字堆）。</text>
    <text x="160" y="370" fill="#7c7360">【重合】汇聚同名所有副本；【精炼】指定两张相同字。</text>
    <text x="160" y="398" fill="#7c7360">守恒：其余真实副本洗回字袋，不会凭空增多或消失。</text>
  </g>
</svg>
